<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <title>{{ Settings.GetStringValue("SiteTitle") }} - {{ if Data.SEOTitle }}{{ Data.SEOTitle }}{{ else }}{{ Data.Title }}{{ end }}</title>
  {{ include "components/common_head" }}
</head>

<body>
  {{ include "components/header" }}
  <main class="container page-content password-content">
    <section class="page-heading">
      <p class="page-kicker">Protected</p>
      <h1>{{ Data.Title }}</h1>
    </section>
    <form class="password-form" id="article_password_form">
      <label>
        <span>访问密码</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="comment-form-actions">
        <button type="submit">解锁阅读</button>
        <span class="comment-form-message" aria-live="polite"></span>
      </div>
    </form>
  </main>
  {{ include "components/footer" RequestTimeDuration }}
  {{ include "components/theme_script" }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('article_password_form');
      if (!form) {
        return;
      }
      const message = form.querySelector('.comment-form-message');
      const button = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        const formData = new FormData(form);
        if (button) {
          button.disabled = true;
        }
        message.textContent = '验证中...';
        fetch('/api/articles/{{ Data.ID }}/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: formData.get('password') }),
        }).then(function(resp) {
          if (!resp.ok) {
            throw new Error('password failed');
          }
          window.location.reload();
        }).catch(function() {
          message.textContent = '密码不正确。';
        }).finally(function() {
          if (button) {
            button.disabled = false;
          }
        });
      });
    });
  </script>
</body>
</html>
