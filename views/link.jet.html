<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <title>{{ Settings.GetStringValue("SiteTitle") }} - Links</title>
  {{ include "components/common_head" }}
</head>

<body>
  {{ include "components/header" }}
  <main class="container page-content">
    <section class="page-heading">
      <p class="page-kicker">Neighbors</p>
      <h1>友链</h1>
    </section>
    <div class="link-list">
      {{ range Data }}
      <a href="{{ .URL }}" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="link-card-image" style="background-image: url('{{ .IconURL }}');"></div>
        <div class="link-card-content">
          <h3>{{ .Name }}</h3>
          <p>{{ .Description }}</p>
        </div>
      </a>
      {{ else }}
      <div class="empty-state link-empty">
        <span class="empty-state-mark" aria-hidden="true"></span>
        <h2>还没有友链</h2>
        <p>等站点主人补上朋友们的入口，这里会更热闹。</p>
      </div>
      {{ end }}
    </div>
  </main>
  {{ include "components/footer" RequestTimeDuration }}
</body>

</html>
