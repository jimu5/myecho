<header class="site-header">
  <div class="container header-inner">
    <a class="site-mark" href="/" aria-label="{{ Settings.GetStringValue("SiteTitle") }} 首页">
      {{ if SiteLogo }}
      <img class="site-mark-logo" src="{{ SiteLogo }}" alt="" width="34" height="34">
      {{ else }}
      <span class="site-mark-symbol" aria-hidden="true"></span>
      {{ end }}
      <span class="site-mark-title">{{ Settings.GetStringValue("SiteTitle") }}</span>
    </a>
    <nav id="nav" class="site-nav" aria-label="主导航">
      {{ if Theme }}
      {{ if SupportsColorMode }}
      <button class="color-mode-toggle" type="button" data-myecho-color-mode-toggle aria-label="切换至深色模式" aria-pressed="false">
        <span class="color-mode-icon" aria-hidden="true"></span>
      </button>
      {{ end }}
      {{ end }}
      <button class="menu-toggle" aria-label="打开导航菜单" aria-expanded="false" aria-controls="primary-menu">
        <span class="hamburger"></span>
      </button>
      <div class="nav-links" id="primary-menu">
          <ul>
            <li>
              <a href="/">首页</a>
            </li>
            <li>
              <a href="/article/categories">分类</a>
            </li>
            <li>
              <a href="/tags">标签</a>
            </li>
            <li>
              <a href="/archive">归档</a>
            </li>
            <li>
              <a href="/links">友链</a>
            </li>
            {{ range NavigationStaticPages }}
            <li>
              <a href="{{ .URL }}">{{ .DisplayName }}</a>
            </li>
            {{ end }}
          </ul>
      </div>
    </nav>
  </div>
</header>
