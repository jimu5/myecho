{{ range . }}
<article class="article-block">
  <div class="article-block-meta">
    <span>{{ .PostTime.Format("January 2, 2006") }}</span>
    {{ if .Category }}
    <a href="/?category_uid={{ .CategoryUID }}">{{ .Category.Name }}</a>
    {{ end }}
    <span>{{ .ReadCount }} 次阅读</span>
  </div>
  <h2>
    <a href="/articles/{{ .ID }}">{{ .Title }}</a>
  </h2>
  <div class="article-block-tags">
    {{ range .Tags }}
    <span>{{ .Name }}</span>
    {{ end }}
  </div>
  <div class="article-block-summary">
    {{ .Summary }}
  </div>
  <div class="article-block-actions">
    <a href="/articles/{{ .ID }}" aria-label="阅读全文：{{ .Title }}">阅读全文</a>
  </div>
</article>
{{ else }}
<div class="empty-state">
  <span class="empty-state-mark" aria-hidden="true"></span>
  <h2>还没有公开文章</h2>
  <p>新的记录会出现在这里。先泡杯茶，等下一次回声。</p>
</div>
{{ end }}
