{{ range . }}
<article class="article-block">
  <div class="article-block-meta">
    <span>{{ .PostTime.Format("January 2, 2006") }}</span>
  </div>
  <h2>
    <a href="/articles/{{ .ID }}">{{ .Title }}</a>
  </h2>
  <div class="article-block-summary">
    {{ .Summary }}
  </div>
  <div class="article-block-actions">
    <a href="/articles/{{ .ID }}" aria-label="阅读全文：{{ .Title }}">阅读全文</a>
  </div>
</article>
{{ end }}
