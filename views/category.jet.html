<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <title>{{ Settings.GetStringValue("SiteTitle") }} - Categories</title>
  {{ include "components/common_head" }}
</head>

<body>
  {{ include "components/header" }}
  <main class="container page-content">
    <section class="page-heading">
      <p class="page-kicker">Archive</p>
      <h1>分类</h1>
    </section>
    <ul class="category-list">
      {{ range Data }}
      <li>
        <a href="/?category_name={{ .Name }}&category_uid={{ .UID }}">
          <span class="category-name">{{ .Name }}</span>
          <span class="category-count">{{ .TotalCount }} 篇</span>
        </a>
      </li>
      {{ end }}
    </ul>
  </main>
  {{ include "components/footer" RequestTimeDuration }}
</body>

</html>
