<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <title>{{ Settings.GetStringValue("SiteTitle") }} - {{ Data.Title }}</title>
  {{ include "components/common_head" }}
</head>

<body>
  <script src="/static/lib/prism/prism.js"></script>
  <link type="text/css" rel="stylesheet" href="/static/lib/prism/prism.css">
  {{ include "components/header" }}
  <div class="container article">
    <h1 class="article-title">
      {{ Data.Title }}
    </h1>
    <div class="article-meta">
        <span>{{ Data.PostTime.Format("January 2, 2006") }}</span>
    </div>
    <div class="article-content" id="article_content">
     {{ Data.Detail.Content | raw }}
    </div>
  </div>

  <div class="toc-container">
    <div class="toc-title">目录</div>
    <div class="toc"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const gallery = new Viewer(document.getElementById('article_content'), {
        inline: false,
        url: 'src',
        title: false,
        toolbar: {
          zoomIn: true,
          zoomOut: true,
          oneToOne: true,
          reset: true,
          prev: true,
          play: true,
          next: true,
          rotateLeft: true,
          rotateRight: true,
          flipHorizontal: true,
          flipVertical: true,
        },
      });

      const toc = document.querySelector('.toc');
      const headings = document.querySelectorAll('.article-content h1, .article-content h2, .article-content h3, .article-content h4, .article-content h5, .article-content h6');

      if (headings.length === 0) {
        document.querySelector('.toc-container').style.display = 'none';
      } else {
        let tocHTML = '<ul>';
        headings.forEach((heading, index) => {
          const id = 'heading-' + index;
          heading.setAttribute('id', id);
          const level = parseInt(heading.tagName.substring(1));
          tocHTML += `<li class="toc-level-${level}"><a href="#${id}">${heading.textContent}</a></li>`;
        });
        tocHTML += '</ul>';
        toc.innerHTML = tocHTML;
      }
    });
  </script>
</body>
