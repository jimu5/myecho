<!DOCTYPE html>
<html lang="zh-hans">

<head>
  <title>{{ Settings.GetStringValue("SiteTitle") }} - {{ Data.Title }}</title>
  {{ include "components/common_head" }}
</head>

<body>
  <script src="/static/lib/prism/prism.js"></script>
  <link type="text/css" rel="stylesheet" href="/static/lib/prism/prism.css">
  {{ include "components/header" }}
  <main class="container article-shell">
    <article class="article">
      <header class="article-hero">
        <p class="page-kicker">Article</p>
        <h1 class="article-title">
          {{ Data.Title }}
        </h1>
        <div class="article-meta">
          <span>{{ Data.PostTime.Format("January 2, 2006") }}</span>
        </div>
      </header>
      <div class="article-content" id="article_content">
        {{ Data.Detail.Content | raw }}
      </div>
    </article>
  </main>

  <aside class="toc-container" aria-label="文章目录">
    <div class="toc-title">目录</div>
    <div class="toc"></div>
  </aside>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const articleContent = document.getElementById('article_content');
      if (window.Viewer && articleContent) {
        new Viewer(articleContent, {
          inline: false,
          url: 'src',
          title: false,
          toolbar: {
            zoomIn: true,
            zoomOut: true,
            oneToOne: true,
            reset: true,
            prev: true,
            play: true,
            next: true,
            rotateLeft: true,
            rotateRight: true,
            flipHorizontal: true,
            flipVertical: true,
          },
        });
      }

      const toc = document.querySelector('.toc');
      const tocContainer = document.querySelector('.toc-container');
      const headings = document.querySelectorAll('.article-content h1, .article-content h2, .article-content h3, .article-content h4, .article-content h5, .article-content h6');

      if (headings.length === 0) {
        tocContainer.style.display = 'none';
      } else {
        const tocList = document.createElement('ul');
        headings.forEach((heading, index) => {
          const id = 'heading-' + index;
          heading.setAttribute('id', id);
          const level = parseInt(heading.tagName.substring(1));
          const item = document.createElement('li');
          const link = document.createElement('a');
          item.className = 'toc-level-' + level;
          link.href = '#' + id;
          link.textContent = heading.textContent;
          item.appendChild(link);
          tocList.appendChild(item);
        });
        toc.appendChild(tocList);
      }
    });
  </script>
</body>
</html>
